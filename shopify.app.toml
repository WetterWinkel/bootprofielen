[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[metaobjects.app.bootprofiel]
name = "Bootprofiel"
description = "Persoonlijk bootprofiel van een WetterWinkel-klant"

  [metaobjects.app.bootprofiel.access]
  admin = "merchant_read_write"

[metaobjects.app.bootprofiel.fields.naam]
name = "Naam boot"
type = "single_line_text_field"
required = true

[metaobjects.app.bootprofiel.fields.data]
name = "Bootgegevens"
type = "json"
required = true

[metaobjects.app.bootprofiel.fields.klant_id]
name = "Shopify klant-ID"
type = "single_line_text_field"
required = true

[customer.metafields.app.bootprofielen]
name = "Bootprofielen"
description = "Bootprofielen die bij deze klant horen"
type = "list.metaobject_reference<$app:bootprofiel>"

  [customer.metafields.app.bootprofielen.access]
  admin = "merchant_read_write"
