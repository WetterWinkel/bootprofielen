# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "47eb38dfb2e4337cb59c85e938937cc9"
name = "Bootprofielen"
application_url = "https://bootprofielen.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_files,write_files"

[auth]
redirect_urls = [
  "https://bootprofielen.onrender.com/auth/callback",
  "https://bootprofielen.onrender.com/auth/shopify/callback",
  "https://bootprofielen.onrender.com/api/auth/callback"
]

[metaobjects.app.bootprofiel]
name = "Bootprofiel"
description = "Persoonlijk bootprofiel van een WetterWinkel-klant"
display_name_field = "naam"

  [metaobjects.app.bootprofiel.access]
  admin = "merchant_read_write"

[metaobjects.app.bootprofiel.fields.naam]
name = "Naam boot"
type = "single_line_text_field"
required = true

[metaobjects.app.bootprofiel.fields.data]
name = "Bootgegevens"
type = "json"
required = true

[metaobjects.app.bootprofiel.fields.klant_id]
name = "Shopify klant-ID"
type = "single_line_text_field"
required = true

[metaobjects.app.bootprofiel.fields.bootfoto]
name = "Bootfoto"
description = "Foto die door de eigenaar aan dit bootprofiel is toegevoegd"
type = "file_reference"

[customer.metafields.app.bootprofielen]
name = "Bootprofielen"
description = "Bootprofielen die bij deze klant horen"
type = "list.metaobject_reference<$app:bootprofiel>"

  [customer.metafields.app.bootprofielen.access]
  admin = "merchant_read_write"
