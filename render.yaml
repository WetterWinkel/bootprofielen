services:
  - type: web
    name: bootprofielen
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        value: https://bootprofielen.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bootprofielen-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: PUBLIC_STORE_URL
        value: https://www.wetterwinkel.nl
      - key: RESEND_API_KEY
        sync: false
      - key: MARKETPLACE_EMAIL_FROM
        value: WetterWinkel Bootmarkt <bootmarkt@wetterwinkel.nl>
      - key: SCOPES
        value: read_customers,write_customers,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_files,write_files,read_orders,write_draft_orders,write_app_proxy

databases:
  - name: bootprofielen-db
    plan: basic-256mb
    databaseName: bootprofielen
    user: bootprofielen
