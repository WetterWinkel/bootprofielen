services:
  - type: web
    name: bootprofielen
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        value: https://bootprofielen.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bootprofielen-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_customers,write_customers,read_metaobjects,write_metaobjects

databases:
  - name: bootprofielen-db
    plan: basic-256mb
    databaseName: bootprofielen
    user: bootprofielen
