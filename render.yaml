services:
  - type: web
    name: bootprofielen
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        value: https://bootprofielen.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bootprofielen-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: PUBLIC_STORE_URL
        value: https://www.wetterwinkel.nl
      - key: RESEND_API_KEY
        sync: false
      - key: MARKETPLACE_EMAIL_FROM
        value: WetterWinkel Bootmarkt <info@wetterwinkel.nl>
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_VECTOR_STORE_ID
        sync: false
      - key: CAPTAIN_AI_DAILY_LIMIT
        value: 10
      - key: CAPTAIN_AI_GLOBAL_DAILY_LIMIT
        value: 100
      - key: CAPTAIN_AI_FREE_MONTHLY_LIMIT
        value: 3
      - key: CAPTAIN_AI_CREDIT_PACK_SIZE
        value: 25
      - key: CAPTAIN_AI_CREDIT_PACK_PRICE_CENTS
        value: 995
      - key: SCOPES
        value: read_customers,write_customers,read_products,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_files,write_files,read_orders,write_draft_orders,write_app_proxy

databases:
  - name: bootprofielen-db
    plan: basic-256mb
    databaseName: bootprofielen
    user: bootprofielen
