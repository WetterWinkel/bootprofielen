name: WetterWinkel-app controle
# Controleert de app-branch (build + typecheck) zonder iets te deployen.
on:
  push:
    branches: [app]
  workflow_dispatch:
jobs:
  build:
    # Precies zoals Render: dezelfde Dockerfile bouwen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (zelfde als Render)
        run: docker build -t bootprofielen-app-check .
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck nieuwe app-bestanden
        run: |
          npx react-router typegen
          npx tsc --noEmit 2>&1 | tee tsc.log || true
          if grep -E "wetter-app|bootmarkt\.app" tsc.log; then
            echo "Typefouten in de nieuwe app-bestanden"; exit 1
          fi
