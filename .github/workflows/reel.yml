name: Reel bouwen
on:
  push:
    paths:
      - "reel/**"
      - ".github/workflows/reel.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gereedschap
        run: |
          pip install -q edge-tts || echo "::error::pip edge-tts mislukt"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || echo "::error::ffmpeg installeren mislukt"; fi
          echo "::notice::ffmpeg $(ffmpeg -version | head -1)"
      - name: Voice-over (Captain-stem)
        run: |
          for dir in reel/*/; do
            name=$(basename "$dir"); v="voice/$name"; [ -d "$v/scenes" ] || continue
            mkdir -p "$v/out"
            voice=$(cat "$v/voice.txt" 2>/dev/null || echo nl-NL-MaartenNeural)
            rate=$(cat "$v/rate.txt" 2>/dev/null || echo +0%)
            for f in "$v"/scenes/*.txt; do
              n=$(basename "$f" .txt)
              [ -s "$v/out/$n.mp3" ] && continue
              edge-tts --voice "$voice" --rate="$rate" -f "$f" --write-media "$v/out/$n.mp3" || echo "::error::edge-tts $name/$n mislukt"
            done
            echo "::notice::audio $name: $(ls $v/out | tr '\n' ' ')"
          done
      - name: Reels bouwen
        run: |
          for dir in reel/*/; do
            [ -x "$dir/build.sh" ] || continue
            name=$(basename "$dir")
            AUDIO_DIR="$GITHUB_WORKSPACE/voice/$name/out" "$dir/build.sh" 2> err.txt || { echo "::error::build $name: $(tail -c 600 err.txt | tr '\n' ' ')"; exit 1; }
            echo "::notice::reel $name klaar: $(ls -la $dir/out | tr '\n' ' ')"
          done
      - name: Resultaat opslaan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f reel/*/out voice/*/out
          git diff --cached --quiet || git commit -m "Reel gebouwd [skip ci]"
          git push
