name: Test routeplanner
on:
  push:
    branches: [app]
    paths: ["app/lib/vaarroute.server.ts", "scripts/test-vaarroute.mjs", ".github/workflows/test-vaarroute.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --max-old-space-size=400 scripts/test-vaarroute.mjs
