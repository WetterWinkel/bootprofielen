name: Probe victron (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          mkdir /tmp/t && cd /tmp/t && npm i -s typescript@5 >/dev/null
          node -e 'const ts=require("typescript"),fs=require("fs");for (const f of ["victron","vaarroute"]) fs.writeFileSync(f+".mjs",ts.transpileModule(fs.readFileSync(process.env.GITHUB_WORKSPACE+"/app/lib/"+f+".server.ts","utf8"),{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2022}}).outputText)'
          cat > t.mjs <<'X'
          process.env.SHOPIFY_API_SECRET = "test";
          const v = await import("./victron.mjs");
          const r = await fetch("https://vrmapi.victronenergy.com/v2/auth/loginAsDemo"); const j = await r.json();
          const tok = j.token; console.log("demo token", !!tok, j.idUser);
          console.log("enc/dec", v.decrypt(v.encrypt("hallo")) === "hallo");
          let me; try { me = await v.vrmMe(tok); console.log("me", me); } catch (e) { console.log("me fout", e.message); me = { idUser: j.idUser || 22 }; }
          for (const site of [219742, 151734]) { try { const sn = await v.vrmSnapshot(tok, site); const { groups, ...rest } = sn; console.log("SNAP", site, JSON.stringify(rest)); console.log("GROUPS", groups.map(g => g.device + ": " + g.values.map(x => x.label + "=" + x.value).join("; ")).join(" || ")); } catch (e) { console.log("SNAPFOUT", site, e.message); } }
          process.exit(0);
          const vr = await import("./vaarroute.mjs");
          const l = await vr.loadStaandeMast(); console.log("SMR lijnen", l.length, l.reduce((s, x) => s + x.coords.length, 0), "punten");
          const t0 = Date.now(); const net = await vr.buildNetwork(console.log); console.log("bouw", Date.now() - t0);
          const air = 16;
          for (const [a, b, n] of [[[5.8365, 53.0935], [5.7115, 52.843], "Grou-Lemmer"], [[4.48, 51.905], [4.90, 52.383], "Rotterdam-Amsterdam"], [[5.79, 53.193], [6.55, 53.226], "Leeuwarden-Groningen"], [[4.30, 51.86], [5.43, 53.17], "Rotterdam-Harlingen"]]) {
            for (const mast of [false, true]) { const r = vr.planRoute(net, a, b, air, undefined, { mast }); console.log(n, mast ? "MAST" : "gewoon", r.ok ? Math.round(r.distanceM / 1000) + " km, smr " + Math.round(r.staandeMastM / 1000) + " km, " + r.waterways.slice(0, 8).join(" > ") : r.reason); }
          }
          X
          node t.mjs
