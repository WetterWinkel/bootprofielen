name: Probe vaardata (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W="https://geo.rijkswaterstaat.nl/services/ogc/gdr/fis_vnds/ows?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&count=2&bbox=5.6,52.9,6.0,53.2,urn:ogc:def:crs:OGC:1.3:CRS84"
          for t in bovengrondse_kabel bovengrondse_pijp minst_gepeilde_diepte vaarwegdiepte veersteiger_p trailerhelling_p jachthaven_p meldpunt navigatiesnelheid max_toegestane_afmeting sab_inzamelpunt autoafzetplaats_p peilstok; do
            echo "== $t"; curl -s "$W&typeName=$t" | python3 -c "import json,sys; d=json.load(sys.stdin); print('n',d.get('numberMatched')); [print(f['geometry']['type'], json.dumps(f['properties'],ensure_ascii=False)[:600]) for f in d.get('features',[])[:2]]" 2>&1 | head -5
          done
          echo "== Overpass"
          curl -s -X POST https://overpass-api.de/api/interpreter --data-urlencode 'data=[out:json][timeout:25];(nwr["leisure"="marina"](53.08,5.80,53.11,5.86);nwr["amenity"="restaurant"](53.08,5.80,53.11,5.86);nwr["route"="ferry"](53.0,5.7,53.2,5.9);nwr["mooring"](53.08,5.80,53.11,5.86););out center tags 15;' | head -c 2500; echo
          curl -sI -X OPTIONS -H "Origin: https://www.wetterwinkel.nl" -H "Access-Control-Request-Method: POST" https://overpass-api.de/api/interpreter | grep -i access-control
