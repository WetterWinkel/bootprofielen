name: Probe marrekrite (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W="https://geoportaal.fryslan.nl/arcgis/services/ProvinciaalGeoRegister/PGR2/MapServer/WFSServer"
          curl -s -m 30 "$W?service=WFS&request=GetCapabilities&version=2.0.0" -o caps.xml; ls -la caps.xml
          grep -o "<wfs:Name>[^<]*</wfs:Name>\|<Name>[^<]*</Name>" caps.xml | grep -i "ligpl\|marre\|aanleg\|boei\|container" | head
          grep -io "outputformat[^>]*>\(.\)\{0,400\}" caps.xml | head -3 | cut -c1-500
          T=$(grep -o "<wfs:Name>[^<]*</wfs:Name>\|<Name>[^<]*</Name>" caps.xml | grep -i "ligplaats" | head -1 | sed 's/<[^>]*>//g'); echo "type=$T"
          for f in GEOJSON geojson "application/json"; do echo "== $f"; curl -s -m 30 "$W?service=WFS&request=GetFeature&version=2.0.0&typeNames=$T&count=2&outputFormat=$f" | head -c 1500; echo; done
          echo "== GML"; curl -s -m 30 "$W?service=WFS&request=GetFeature&version=2.0.0&typeNames=$T&count=2" | head -c 3000; echo
          echo "== hits"; curl -s -m 30 "$W?service=WFS&request=GetFeature&version=2.0.0&typeNames=$T&resultType=hits" | head -c 400
          echo "== REST"; curl -s -m 30 "https://geoportaal.fryslan.nl/arcgis/rest/services/ProvinciaalGeoRegister/PGR2/MapServer?f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(l['id'],l['name']) for l in d.get('layers',[]) if any(k in l['name'].lower() for k in ['ligpl','marre','boei','aanleg','container'])]"
