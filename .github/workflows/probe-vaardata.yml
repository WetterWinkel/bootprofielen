name: Probe overpass (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q='[out:json][timeout:20];(nwr["shop"="supermarket"](53.08,5.80,53.11,5.86);nwr["leisure"="marina"](53.08,5.80,53.11,5.86););out center tags 5;'
          for h in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $h"; curl -s -m 30 -A "WetterWinkel-app/1.0 (info@wetterwinkel.nl)" -G "$h" --data-urlencode "data=$Q" -w "\nHTTP %{http_code}\n" | head -c 700; echo
          done
