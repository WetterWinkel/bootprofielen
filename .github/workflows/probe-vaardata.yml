name: Probe weer (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          base="latitude=53.093&longitude=5.830&timezone=Europe%2FAmsterdam"
          curl -s -w "\nHTTP %{http_code}\n" "https://api.open-meteo.com/v1/forecast?$base&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation_probability,temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset&wind_speed_unit=kn&forecast_days=3" | head -c 600; echo
          curl -s -w "\nHTTP %{http_code}\n" "https://marine-api.open-meteo.com/v1/marine?$base&current=wave_height,wave_direction,wave_period" | head -c 400
