name: Probe vaardata (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.vaarweginformatie.nl/wfswms/dataservice/1.4
          G=$(curl -s $B/geogeneration | grep -o '"GeoGeneration":[0-9]*' | cut -d: -f2)
          echo "== single"; curl -s "$B/$G/operatingtimes/2325" | head -c 2500; echo
          echo "== bridge single"; curl -s "$B/$G/bridge/6484" | head -c 800; echo
          echo "== radiocallinpoint"; curl -s "$B/$G/radiocallinpoint?count=1" | head -c 800; echo
          echo "== CORS"; curl -sI -H "Origin: https://www.wetterwinkel.nl" "$B/$G/operatingtimes/2325" | grep -i "access-control" || echo geen-cors
