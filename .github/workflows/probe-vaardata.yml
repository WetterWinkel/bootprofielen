name: Probe staande mast (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W="https://geo.rijkswaterstaat.nl/services/ogc/gdr/fis_vnds/ows?service=WFS&version=2.0.0"
          curl -s -m 60 "$W&request=GetCapabilities" | grep -o "<Name>[^<]*</Name>" | sed 's/<[^>]*>//g' | tr '\n' ' '; echo
          echo "== kabel"; curl -s -m 60 "$W&request=GetFeature&outputFormat=application/json&typeName=bovengrondse_kabel&count=2" | head -c 1500; echo
          echo "== brug sample"; curl -s -m 60 "$W&request=GetFeature&outputFormat=application/json&typeName=brug&count=1" | head -c 1200; echo
          echo "== nwb"; curl -s -m 60 "https://api.pdok.nl/rws/nationaal-wegenbestand-vaarwegen/ogc/v1/collections?f=json" | grep -o '"id":"[^"]*"' | head; 
          C=$(curl -s -m 60 "https://api.pdok.nl/rws/nationaal-wegenbestand-vaarwegen/ogc/v1/collections?f=json" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -s -m 60 "https://api.pdok.nl/rws/nationaal-wegenbestand-vaarwegen/ogc/v1/collections/$C/items?f=json&limit=1" | head -c 1500; echo
          for t in $(curl -s -m 60 "$W&request=GetCapabilities" | grep -o "<Name>[^<]*</Name>" | sed 's/<[^>]*>//g' | grep -i "mast\|route\|recrea\|cemt\|fairway\|vaarweg"); do echo "== $t"; curl -s -m 60 "$W&request=GetFeature&outputFormat=application/json&typeName=$t&count=1" | head -c 1000; echo; done
