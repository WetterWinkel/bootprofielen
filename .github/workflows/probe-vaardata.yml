name: Probe stremmingen (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          mkdir /tmp/t && cd /tmp/t && npm i -s typescript@5 >/dev/null
          node -e 'const ts=require("typescript"),fs=require("fs");fs.writeFileSync("s.mjs",ts.transpileModule(fs.readFileSync(process.env.GITHUB_WORKSPACE+"/app/lib/stremmingen.server.ts","utf8"),{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2022}}).outputText)'
          cat > t.mjs <<'X'
          const m = await import("./s.mjs");
          const t0 = Date.now(); m.ensureStremmingen();
          while (!m.ensureStremmingen().ready) { await new Promise(r => setTimeout(r, 1000)); if (Date.now() - t0 > 600000) break; }
          console.log("klaar na", (Date.now() - t0) / 1000, "s", m.ensureStremmingen());
          const a = m.activeNotices();
          const c = {}; a.forEach(x => { const k = x.cat + "/" + x.status; c[k] = (c[k] || 0) + 1; }); console.log(a.length, c);
          console.log("geheugen MB", Math.round(process.memoryUsage().heapUsed / 1e6));
          const fr = a.filter(x => x.lat > 52.8 && x.lat < 53.5 && x.lon > 5.3 && x.lon < 6.4);
          fr.slice(0, 25).forEach(x => console.log(x.cat, x.status, "|", x.name, "|", x.limits.join(","), "|", x.when, "|", x.contents.slice(0, 80)));
          console.log("blokkerend nu:", m.blockingPoints().length);
          X
          node t.mjs
