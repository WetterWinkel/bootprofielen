name: Probe vaardata (tijdelijk)
on:
  push:
    branches: [app]
    paths: [".github/workflows/probe-vaardata.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.vaarweginformatie.nl/wfswms/dataservice/1.4
          G=$(curl -s $B/geogeneration | grep -o '"GeoGeneration":[0-9]*' | cut -d: -f2)
          for t in opening lock chamber berth harbour; do echo "== $t"; curl -s "$B/$G/$t?count=2&offset=100" | head -c 1800; echo; done
          echo "== bridge Grou search"; curl -s "$B/$G/bridge?count=5000" | python3 -c "
          import json,sys; d=json.load(sys.stdin); r=d['Result']; print('total',d['TotalCount'],'got',len(r))
          fr=[b for b in r if 'Grou' in (b.get('City') or '') or 'Gallebr' in (b.get('Name') or '')]; print(json.dumps(fr[:2])[:1500])
          print('keys', sorted({k for b in r for k in b})) "
          echo "== WFS bbox tests"
          W="https://geo.rijkswaterstaat.nl/services/ogc/gdr/fis_vnds/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=brug&outputFormat=application/json&count=2"
          curl -s "$W&bbox=53.0,5.7,53.1,5.9,urn:ogc:def:crs:EPSG::4326" | head -c 300; echo
          curl -s "$W&bbox=5.7,53.0,5.9,53.1,urn:ogc:def:crs:OGC:1.3:CRS84" | head -c 300; echo
          curl -s "$W&srsName=EPSG:4326&bbox=5.7,53.0,5.9,53.1,EPSG:4326" | head -c 300; echo
          echo "== WFS opening with clearance in Friesland"
          curl -s "https://geo.rijkswaterstaat.nl/services/ogc/gdr/fis_vnds/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=opening&outputFormat=application/json&count=2&bbox=5.7,53.0,5.9,53.1,urn:ogc:def:crs:OGC:1.3:CRS84" | head -c 2000; echo
          echo "== jachthaven"
          curl -s "https://geo.rijkswaterstaat.nl/services/ogc/gdr/fis_vnds/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=jachthaven_p&outputFormat=application/json&count=1" | head -c 1200; echo
          echo "== NDW"
          curl -sL -o p.gz "https://opendata.ndw.nu/planningsfeed_brugopeningen.xml.gz"; ls -la p.gz; gunzip -c p.gz | head -c 2500; echo
          echo "== NWB count"
          curl -s "https://api.pdok.nl/rws/nationaal-wegenbestand-vaarwegen/ogc/v1/collections/vaarwegvakken/items?f=json&limit=1" | grep -o '"numberMatched":[0-9]*'
